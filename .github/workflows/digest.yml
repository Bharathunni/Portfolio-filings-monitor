name: portfolio-digest
on:
  schedule:
    - cron: "30 1 * * *"        # 7:00 AM IST
  workflow_dispatch:            # manual trigger button
  push:
    paths: ["portfolios/**"]    # validates every portfolio edit at commit time

concurrency:
  group: portfolio-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Validate portfolios
        run: python portfolio_digest.py --validate
      - name: Send digests
        if: github.event_name != 'push'      # push events only validate, don't email
        env:
          GMAIL_SENDER: ${{ vars.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Forks and the public showcase copy have no mail secret: validate only.
          if [ -z "$GMAIL_SENDER" ] || [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "GMAIL_SENDER / GMAIL_APP_PASSWORD not configured; skipping send."
            exit 0
          fi
          python portfolio_digest.py
