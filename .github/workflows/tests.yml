name: tests
on:
  push:
    paths: ["**.py", "requirements.txt", ".github/workflows/tests.yml"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python examples/render_sample.py   # offline end-to-end render on synthetic filings
